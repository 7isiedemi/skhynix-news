<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海力士新闻聚合 | SK Hynix News Hub</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #06080f;
      --bg-secondary: #0d1117;
      --bg-card: #151b28;
      --bg-card-hover: #1a2338;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent-blue: #58a6ff;
      --accent-cyan: #39d2c0;
      --accent-purple: #bc8cff;
      --accent-green: #3fb950;
      --accent-orange: #d29922;
      --accent-red: #f85149;
      --accent-pink: #f778ba;
      --border-color: #21262d;
      --radius: 14px;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ===== Header ===== */
    .header {
      background: rgba(13, 17, 23, 0.8);
      backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(88, 166, 255, 0.25);
    }

    .logo h1 {
      font-size: 19px;
      font-weight: 700;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-wrapper {
      position: relative;
      width: 300px;
    }

    .search-wrapper svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-wrapper input {
      width: 100%;
      padding: 10px 16px 10px 42px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    .search-wrapper input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.12);
    }

    .search-wrapper input::placeholder { color: var(--text-muted); }

    .btn-icon {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s;
    }

    .btn-icon:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      background: rgba(88, 166, 255, 0.08);
    }

    .btn-icon.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .last-update {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .btn-danger:hover {
      border-color: var(--accent-red) !important;
      color: var(--accent-red) !important;
      background: rgba(248, 81, 73, 0.08) !important;
    }

    /* ===== Storage Bar ===== */
    .storage-bar {
      background: rgba(88, 166, 255, 0.04);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 0;
    }

    .storage-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .storage-info {
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .storage-tip {
      color: var(--text-muted);
    }

    /* ===== Confirm Dialog ===== */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      display: none;
    }

    .confirm-overlay.show { display: flex; }

    .confirm-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px 32px;
      max-width: 400px;
      text-align: center;
    }

    .confirm-box h3 {
      font-size: 17px;
      margin-bottom: 10px;
    }

    .confirm-box p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 22px;
    }

    .confirm-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .confirm-btns button {
      padding: 9px 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      font-family: inherit;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .btn-confirm-danger {
      background: var(--accent-red);
      border-color: var(--accent-red);
      color: #fff;
    }

    .btn-confirm-danger:hover { opacity: 0.85; }

    /* ===== Stats ===== */
    .stats-bar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 18px 0;
    }

    .stats-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 28px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    .stat {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.25s;
    }

    .stat::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .stat:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

    .stat-all::after { background: linear-gradient(90deg, #58a6ff, #bc8cff); }
    .stat-hynix::after { background: #58a6ff; }
    .stat-hbm::after { background: #bc8cff; }
    .stat-memory::after { background: #39d2c0; }
    .stat-korea::after { background: #d29922; }
    .stat-semi::after { background: #3fb950; }

    .stat-num {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
    }

    .stat-all .stat-num { color: #58a6ff; }
    .stat-hynix .stat-num { color: #58a6ff; }
    .stat-hbm .stat-num { color: #bc8cff; }
    .stat-memory .stat-num { color: #39d2c0; }
    .stat-korea .stat-num { color: #d29922; }
    .stat-semi .stat-num { color: #3fb950; }

    .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    /* ===== Categories ===== */
    .cat-bar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
    }

    .cat-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cat-inner::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 7px 18px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
    }

    .cat-btn:hover {
      border-color: var(--accent-blue);
      color: var(--text-primary);
    }

    .cat-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
      font-weight: 500;
    }

    /* ===== News Grid ===== */
    .main-area {
      max-width: 1440px;
      margin: 0 auto;
      padding: 28px;
      min-height: 60vh;
    }

    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 18px;
    }

    /* ===== News Card ===== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 22px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(16px);
      animation: cardIn 0.35s ease forwards;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      border-color: rgba(88, 166, 255, 0.25);
      background: var(--bg-card-hover);
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .badge-hynix { background: rgba(88,166,255,0.12); color: #58a6ff; }
    .badge-hbm { background: rgba(188,140,255,0.12); color: #bc8cff; }
    .badge-memory { background: rgba(57,210,192,0.12); color: #39d2c0; }
    .badge-korea_stock { background: rgba(210,153,34,0.12); color: #d29922; }
    .badge-semiconductor { background: rgba(63,185,80,0.12); color: #3fb950; }
    .badge-other { background: rgba(139,148,158,0.12); color: #8b949e; }

    .card-source { font-size: 12px; color: var(--text-muted); }
    .card-time { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-title mark {
      background: rgba(88,166,255,0.18);
      color: #79c0ff;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .card-summary {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }

    .read-link {
      font-size: 13px;
      color: var(--accent-blue);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .read-link:hover { color: #79c0ff; }

    /* ===== Loading / Empty ===== */
    .loading-wrap {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 0;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }

    .loading-wrap p { color: var(--text-muted); font-size: 14px; }

    .empty-wrap {
      text-align: center;
      padding: 100px 0;
      display: none;
    }

    .empty-wrap .empty-icon { font-size: 56px; margin-bottom: 16px; }
    .empty-wrap h3 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-wrap p { color: var(--text-muted); font-size: 14px; }

    /* ===== Load More ===== */
    .more-wrap {
      text-align: center;
      padding: 32px 0;
      display: none;
    }

    .btn-more {
      padding: 11px 44px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }

    .btn-more:hover {
      border-color: var(--accent-blue);
      background: rgba(88,166,255,0.08);
    }

    /* ===== Footer ===== */
    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 28px;
      margin-top: 40px;
    }

    footer p { color: var(--text-muted); font-size: 13px; }
    footer .sub { margin-top: 6px; font-size: 12px; opacity: 0.6; }

    /* ===== Responsive ===== */
    @media (max-width: 1024px) {
      .stats-inner { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      .header-inner { flex-wrap: wrap; }
      .search-wrapper { width: 100%; order: 10; }
      .stats-inner { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .news-grid { grid-template-columns: 1fr; }
      .main-area { padding: 16px; }
      .stat-num { font-size: 20px; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">📡</div>
        <div>
          <h1>海力士新闻聚合</h1>
          <div class="logo-sub">SK HYNIX NEWS HUB</div>
        </div>
      </div>
      <div class="header-right">
        <div class="search-wrapper">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="搜索新闻关键词..." />
        </div>
        <button class="btn-icon" id="btnRefresh" title="刷新">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
        <button class="btn-icon" id="btnExport" title="导出新闻数据">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="btn-icon btn-danger" id="btnClear" title="清空历史数据">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        </button>
        <span class="last-update" id="lastUpdate">--</span>
      </div>
    </div>
  </header>

  <!-- 存储信息条 -->
  <div class="storage-bar">
    <div class="storage-inner">
      <span class="storage-info" id="storageInfo">☁️ 云端新闻: 加载中...</span>
      <span class="storage-tip">数据存储在 Supabase 云端，跨设备同步，永不丢失</span>
    </div>
  </div>

  <!-- Stats -->
  <section class="stats-bar">
    <div class="stats-inner">
      <div class="stat stat-all"><div class="stat-num" id="sAll">0</div><div class="stat-label">全部新闻</div></div>
      <div class="stat stat-hynix"><div class="stat-num" id="sHynix">0</div><div class="stat-label">SK海力士</div></div>
      <div class="stat stat-hbm"><div class="stat-num" id="sHBM">0</div><div class="stat-label">HBM</div></div>
      <div class="stat stat-memory"><div class="stat-num" id="sMemory">0</div><div class="stat-label">存储芯片</div></div>
      <div class="stat stat-korea"><div class="stat-num" id="sKorea">0</div><div class="stat-label">韩国股市</div></div>
      <div class="stat stat-semi"><div class="stat-num" id="sSemi">0</div><div class="stat-label">半导体</div></div>
    </div>
  </section>

  <!-- Categories -->
  <nav class="cat-bar">
    <div class="cat-inner">
      <button class="cat-btn active" data-cat="all">🌐 全部</button>
      <button class="cat-btn" data-cat="hynix">🏢 SK海力士</button>
      <button class="cat-btn" data-cat="hbm">🧊 HBM</button>
      <button class="cat-btn" data-cat="memory">💾 存储芯片</button>
      <button class="cat-btn" data-cat="korea_stock">📈 韩国股市</button>
      <button class="cat-btn" data-cat="semiconductor">🔬 半导体</button>
    </div>
  </nav>

  <!-- Main -->
  <main class="main-area">
    <div class="news-grid" id="grid"></div>
    <div class="empty-wrap" id="empty">
      <div class="empty-icon">📭</div>
      <h3>暂无相关新闻</h3>
      <p>尝试切换分类或修改搜索关键词</p>
    </div>
    <div class="more-wrap" id="moreWrap">
      <button class="btn-more" id="btnMore">加载更多</button>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>海力士新闻聚合 © 2026 | 数据来源：Google News、Bing News、RSS 等公开渠道</p>
    <p class="sub">自动从多个新闻源聚合 · 新闻持久化存储于 Supabase 云端 · 版权归原作者所有</p>
  </footer>

  <!-- 确认弹窗 -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h3>确认清空所有云端新闻？</h3>
      <p>此操作不可恢复，云端保存的所有新闻数据将被删除。</p>
      <div class="confirm-btns">
        <button class="btn-cancel" id="btnCancelClear">取消</button>
        <button class="btn-confirm-danger" id="btnConfirmClear">确认清空</button>
      </div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // ===== Supabase 配置 =====
    const SUPABASE_URL = 'https://nbnotmzchmlbfiearpax.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ibm90bXpjaG1sYmZpZWFycGF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjg0ODIsImV4cCI6MjA5MTY0NDQ4Mn0.UzafoPvPBYIEM211Tx0zTXBQ5dqG_-KPACpFF9o6DnM';
    const API_BASE = `${SUPABASE_URL}/rest/v1`;
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    };

    // ===== Supabase 云端存储 =====
    const CloudDB = {
      async loadAll() {
        try {
          const resp = await fetch(`${API_BASE}/news?select=*&order=date.desc&limit=2000`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          });
          if (!resp.ok) throw new Error(resp.statusText);
          const rows = await resp.json();
          return rows.map(r => ({
            title: r.title,
            summary: r.summary || '',
            url: r.url || '',
            date: r.date || r.created_at,
            source: r.source || '',
            category: r.category || 'other',
            thumb: r.thumb || ''
          }));
        } catch (e) {
          console.warn('云端读取失败:', e.message);
          return [];
        }
      },

      async saveMany(newsList) {
        if (!newsList.length) return;
        // 用 upsert 避免重复（基于 id 主键）
        const rows = newsList.map(n => ({
          id: this.makeId(n.title),
          title: n.title,
          summary: (n.summary || '').slice(0, 500),
          url: n.url || '',
          date: n.date || new Date().toISOString(),
          source: n.source || '',
          category: n.category || 'other',
          thumb: n.thumb || ''
        }));

        // 分批写入，每批 50 条
        for (let i = 0; i < rows.length; i += 50) {
          const batch = rows.slice(i, i + 50);
          try {
            await fetch(`${API_BASE}/news`, {
              method: 'POST',
              headers: { ...HEADERS, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
              body: JSON.stringify(batch)
            });
          } catch (e) {
            console.warn('云端写入失败:', e.message);
          }
        }
      },

      async clearAll() {
        try {
          await fetch(`${API_BASE}/news?id=neq.impossible_id_placeholder`, {
            method: 'DELETE',
            headers: HEADERS
          });
        } catch (e) {
          console.warn('云端清空失败:', e.message);

      async getCount() {
        try {

            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Prefer': 'count=exact'
            }
          });
          const count = resp.headers.get('content-range');
          if (count) {
            const match = count.match(/\/(\d+)/);
            return match ? parseInt(match[1]) : 0;
          }
          return 0;
        } catch { return 0; }
      },

      makeId(title) {
        // 根据标题生成稳定的唯一ID用于去重
        let hash = 0;
        const str = title.replace(/\s+/g, '').toLowerCase();
        for (let i = 0; i < str.length; i++) {
          const c = str.charCodeAt(i);
          hash = ((hash << 5) - hash) + c;
          hash |= 0;
        }
        return 'n_' + Math.abs(hash).toString(36);
      },

      exportJSON(news) {

      }

    // ===== 状态 =====

    // ===== Init =====

    async function init() {
      bindEvents();

      // 1. 先从云端加载历史数据
      const cloudData = await CloudDB.loadAll();
      if (cloudData.length > 0) {
        allNews = cloudData;

        updateStorageInfo();
        render();
        lastUpdate.textContent = '正在获取最新新闻...';

    function bindEvents() {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelector('.cat-btn.active').classList.remove('active');
          b.classList.add('active');

        btnRefresh.classList.remove('spinning');

        if (e.target === confirmOverlay) confirmOverlay.classList.remove('show');

    // ===== 抓取并同步到云端 =====
    async function fetchAndSync() {
      const freshNews = await fetchRemoteNews();

      if (freshNews.length > 0) {
        // 写入云端（自动去重 upsert）
        await CloudDB.saveMany(freshNews);
      }

      // 重新从云端加载完整数据（保证各设备一致）
      const cloudData = await CloudDB.loadAll();
      if (cloudData.length > 0) {
        allNews = cloudData;
      } else if (freshNews.length > 0) {
        allNews = freshNews;
      } else if (allNews.length === 0) {
        // 首次使用，写入示例数据到云端
        const samples = getSampleNews();
        await CloudDB.saveMany(samples);
        allNews = samples;
      }

      lastUpdate.textContent = '更新: ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      updateStats();
      updateStorageInfo();
    }

    // ===== 远程新闻抓取（CORS代理 + XML解析） =====
    async function fetchRemoteNews() {
      const allTasks = [];

      // Google News
      for (const q of SEARCH_QUERIES) {
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(q)}&hl=zh-CN&gl=CN&ceid=CN:zh-Hans`;
        allTasks.push({ rssUrl, source: 'Google News' });
      }

      // Bing News
      const bingQueries = [
        'SK hynix', 'SK海力士', 'HBM memory', 'HBM3E', 'HBM4',
        '海力士 存储芯片', 'DRAM价格', 'NAND flash价格',
        'DDR5 AI server', 'SSD market price',
        '存储芯片 市场', '美光 Micron DRAM', '三星 Samsung 存储',
        '长江存储', '铠侠 Kioxia', 'CXL memory',
        '半导体 存储 市场', 'LPDDR5X AI',
      ];
      for (const q of bingQueries) {
        const rssUrl = `https://www.bing.com/news/search?q=${encodeURIComponent(q)}&format=rss&count=30`;
        allTasks.push({ rssUrl, source: 'Bing News' });
      }

      // RSS 源
      for (const url of RSS_FEEDS) {
        const name = url.includes('36kr') ? '36氪' : url.includes('ithome') ? 'IT之家' : 'RSS';
        allTasks.push({ rssUrl: url, source: name });
      }

      // 并发抓取（每 4 个一批，避免代理限流）
      const raw = [];
      for (let i = 0; i < allTasks.length; i += 4) {
        const batch = allTasks.slice(i, i + 4);
        const results = await Promise.allSettled(
          batch.map(t => fetchRSSWithProxy(t.rssUrl, t.source))
        );
        results.forEach(r => {
          if (r.status === 'fulfilled' && r.value) raw.push(...r.value);
        });
      }

      // 过滤 Google/Bing 结果中的相关新闻（RSS 源已经是搜索结果所以放宽）
      const relevant = raw.filter(n => n.title && n.title.length > 5 && isRelevant(n.title + ' ' + (n.summary || '')));
      const categorized = relevant.map(n => ({ ...n, category: categorize(n.title, n.summary) }));
      return dedupe(categorized);
    }

    // 解析 RSS XML 文本
    function parseRSSXml(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'text/xml');
      const items = doc.querySelectorAll('item');
      const results = [];
      items.forEach(item => {
        const title = item.querySelector('title')?.textContent || '';
        const link = item.querySelector('link')?.textContent || '';
        const desc = item.querySelector('description')?.textContent || '';
        const pubDate = item.querySelector('pubDate')?.textContent || '';
        const srcEl = item.querySelector('source');
        results.push({
          title: stripHtml(title),
          summary: stripHtml(desc).slice(0, 500),
          url: link,
          date: pubDate ? new Date(pubDate).toISOString() : new Date().toISOString(),
          source: srcEl ? srcEl.textContent : '',
          thumb: ''
        });
      });
      return results;
    }

    // 通过 CORS 代理抓取 RSS，自动轮换 + rss2json 兜底
    async function fetchRSSWithProxy(rssUrl, sourceName) {
      // 方式1：CORS 代理直接获取 XML
      for (const proxyFn of CORS_PROXIES) {
        try {
          const proxyUrl = proxyFn(rssUrl);
          const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
          if (!resp.ok) continue;
          const text = await resp.text();
          if (!text.includes('<item')) continue;
          const items = parseRSSXml(text);
          if (items.length > 0) {
            return items.map(n => ({ ...n, source: n.source || sourceName }));
          }
        } catch (e) { continue; }
      }

      // 方式2：rss2json 兜底
      for (const apiFn of RSS2JSON_APIS) {
        try {
          const url = apiFn(rssUrl);
          const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
          if (!resp.ok) continue;
          const data = await resp.json();
          if (data.status !== 'ok' || !data.items) continue;
          return data.items.map(item => ({
            title: stripHtml(item.title || ''),
            summary: stripHtml(item.description || item.content || '').slice(0, 250),
            url: item.link || '',
            date: item.pubDate || new Date().toISOString(),
            source: sourceName,
            thumb: item.thumbnail || item.enclosure?.link || ''
          }));
        } catch (e) { continue; }
      }

      return [];
    }

    // ===== 工具函数 =====
    function isRelevant(text) {
      const lower = text.toLowerCase();
      return ALL_KEYWORDS.some(k => lower.includes(k.toLowerCase()));
    }

    function categorize(title, summary) {
      const text = (title + ' ' + (summary || '')).toLowerCase();
      for (const [cat, kws] of Object.entries(KEYWORDS_MAP)) {
        if (kws.some(k => text.includes(k.toLowerCase()))) return cat;
      }
      return 'other';
    }

    function dedupe(arr) {
      const seen = new Set();
      return arr.filter(n => {
        const key = n.title.replace(/\s+/g, '').slice(0, 35).toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function stripHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.innerHTML = s;
      return d.textContent || '';
    }

    function escHtml(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function highlight(text) {
      const hls = ['SK海力士','海力士','SK hynix','Hynix','HBM','HBM3','HBM3E','HBM4',
        'DRAM','NAND','DDR5','DDR4','LPDDR','SSD','GDDR','CXL',
        '美光','Micron','三星','Samsung','长江存储','铠侠','Kioxia','西部数据',
        '合肥长鑫','兆易创新','紫光'];
      let r = text;
      hls.forEach(k => {
        const re = new RegExp('(' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
        r = r.replace(re, '<mark>$1</mark>');
      });
      return r;
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diff = Date.now() - new Date(dateStr).getTime();
      if (diff < 0) return '刚刚';
      const m = Math.floor(diff / 60000);
      if (m < 1) return '刚刚';
      if (m < 60) return m + '分钟前';
      const h = Math.floor(m / 60);
      if (h < 24) return h + '小时前';
      const d = Math.floor(h / 24);
      if (d < 7) return d + '天前';
      if (d < 30) return d + '天前';
      return new Date(dateStr).toLocaleDateString('zh-CN', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function filterAndRender() {
      filtered = allNews.slice();

      if (kw) filtered = filtered.filter(n => (n.title + n.summary).toLowerCase().includes(kw));
      renderPage(false);
    }

    function render() {

    function renderPage(append) {
      if (!append) {
        filtered = allNews.slice();
        if (currentCat !== 'all') filtered = filtered.filter(n => n.category === currentCat);
        const kw = searchInput.value.trim().toLowerCase();
        if (kw) filtered = filtered.filter(n => (n.title + n.summary).toLowerCase().includes(kw));
      }

      if (!append) grid.innerHTML = '';

      const start = append ? (currentPage - 1) * PAGE_SIZE : 0;
      const end = currentPage * PAGE_SIZE;
      const slice = filtered.slice(start, end);

      if (filtered.length === 0 && !append) {
        empty.style.display = 'block';
        moreWrap.style.display = 'none';
        return;
      }
      empty.style.display = 'none';

      slice.forEach((n, i) => {
        const el = document.createElement('article');

          <div class="card-meta">

            <span class="card-source">${escHtml(n.source)}</span>
            <span class="card-time">${timeAgo(n.date)}</span>
          </div>
          <h3 class="card-title">${highlight(escHtml(n.title))}</h3>
          <p class="card-summary">${escHtml(n.summary)}</p>
          <div class="card-footer">
            <a class="read-link" href="${escHtml(n.url)}" target="_blank" rel="noopener">阅读原文 →</a>
          </div>
        `;
        el.addEventListener('click', e => {
          if (e.target.tagName !== 'A') window.open(n.url, '_blank', 'noopener');
        });
        grid.appendChild(el);
      });

      moreWrap.style.display = end < filtered.length ? 'block' : 'none';
    }

      grid.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><p>正在从云端加载 & 抓取最新新闻...</p></div>';
